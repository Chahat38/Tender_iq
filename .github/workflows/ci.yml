# Continuous integration: offline test suite + migration validation.
#
# Deliberately runs only what needs no secrets and no external network:
#   * byte-compilation of every Python module,
#   * PostgreSQL grammar validation of the Supabase migration
#     (pglast parses it before it ever reaches a server),
#   * the default pytest run (offline tests only; `network` and
#     `postgres` marked tests are deselected by pytest.ini).
#
# The `postgres` job stands up a disposable stock Postgres (service
# container) and runs the `postgres`-marked RLS/storage tests against
# the real migration + auth shim.
#
# Network-dependent crawler tests live in the `network` marker and are
# exercised by the collect workflow instead.

name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Install collector dependencies
        run: python -m pip install -r collector/requirements.txt

      - name: Lint
        run: |
          python -m pip install ruff
          ruff check collector scripts

      - name: Byte-compile all Python sources
        run: python -m compileall -q collector scripts

      - name: Validate Postgres migration SQL
        run: python scripts/validate_sql.py

      - name: Run offline test suite
        run: python -m pytest

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Install collector dependencies
        run: python -m pip install -r collector/requirements.txt

      - name: Run live-Postgres tests (RLS + storage against real migration)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: python -m pytest -o addopts="-ra" -m postgres -q
