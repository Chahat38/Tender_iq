# Stage 4: scheduled collection workflow for TenderScout AI.
#
# Runs the PPRA EPMS collector every 6 hours on GitHub's free
# ubuntu-latest runners, and on demand via workflow_dispatch.
#
# Required repository secret:
#   CONTACT_EMAIL - contact address used in the crawler User-Agent
#                   (polite-crawling rule; the run refuses to start
#                   without it).
#
# Note: scheduled workflows only fire from the repository's default
# branch, and GitHub disables them automatically after 60 days of
# repository inactivity.

name: collect

on:
  schedule:
    # Every 6 hours at :00 UTC. GitHub may delay cron runs a few
    # minutes under runner load; that is acceptable for tenders.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

# The workflow only reads the repository; no write access needed.
permissions:
  contents: read

# Never crawl the source with two overlapping runs (politeness rule):
# queue instead of cancel so a manual dispatch waits its turn.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # Polite-crawl worst case (every page timing out + retries) is
    # roughly 45 minutes; 90 leaves comfortable headroom.
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Install collector dependencies
        run: python -m pip install -r collector/requirements.txt

      # PoliteClient would silently send "contact: unset" if the secret
      # is missing; refuse to crawl without a real contact address.
      - name: Verify CONTACT_EMAIL secret is configured
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: |
          if [ -z "$CONTACT_EMAIL" ]; then
            echo "::error::CONTACT_EMAIL secret is not set. Add it under Settings > Secrets and variables > Actions; TenderScout does not crawl without a contact address."
            exit 1
          fi
          echo "CONTACT_EMAIL is configured."

      - name: Run collector (PPRA EPMS)
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          TENDERSCOUT_DB_PATH: collector/tenderscout.db
        # --enrich-details fetches each tender's detail page (same polite
        # rate limits) so documents and procurement type are stored too;
        # detail failures are reported but never fail the listing run.
        run: python collector/main.py --enrich-details

      # On failure, keep the database (and any log files) as a run
      # artifact so the failed run can be inspected after the runner
      # is destroyed. Success does not upload anything.
      - name: Upload database and logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tenderscout-db-${{ github.run_id }}
          path: |
            collector/tenderscout.db
            collector/*.log
          if-no-files-found: warn
