[pytest]
# TenderScout test configuration.
#
# Default run (local and CI) executes OFFLINE tests only: every test is
# either fixture/in-memory based (no marker) or explicitly marked
# `network` / `postgres`. CI never has credentials or network access to
# the production database, so those two markers are deselected by the
# addopts below. Run them explicitly when needed:
#
#     pytest -m network      # live-source smoke tests
#     pytest -m postgres     # RLS / cross-user access tests (needs
#                            # TEST_DATABASE_URL with a Supabase project)
testpaths = collector/tests
markers =
    network: hits the live network (excluded from the default run and CI)
    postgres: needs a real Postgres/Supabase connection (excluded from the default run and CI)
addopts = -ra -m "not network and not postgres"
filterwarnings =
    # Third-party: starlette's TestClient still imports the deprecated
    # anyio alias (starlette 0.41 / anyio 4); not our code to fix.
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
